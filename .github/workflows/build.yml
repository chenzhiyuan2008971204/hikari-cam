name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest assembleRelease > build.log 2>&1
          status=$?
          set -e
          tail -5 build.log
          if [ $status -ne 0 ]; then
            echo "===== COMPILER ERRORS ====="
            grep -E "^e: |^w: .*(Unresolved|Type mismatch)|FAILED|What went wrong" -A2 build.log | head -120
            exit $status
          fi
          cp app/build/outputs/apk/release/app-release.apk HikariCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HikariCam
          path: HikariCam.apk
      - name: Publish download (Releases)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hikari-v${{ github.run_number }}
          name: 光 Hikari 相機 #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: 用小米14 點下方的 HikariCam.apk 下載並安裝。
          files: HikariCam.apk

  # The app on an Android 14 emulator: engine tests on the real Android GL stack, and the
  # Filter Lab driven through its UI. Screenshots and reports are uploaded as "lab-emulator".
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest > build.log 2>&1 || { grep -E "^e: " build.log | head -80; exit 1; }
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated -no-snapshot
          disable-animations: true
          script: |
            mkdir -p lab-emulator
            adb logcat -c || true
            ./gradlew connectedDebugAndroidTest --stacktrace || touch lab-emulator/TESTS_FAILED
            timeout 60 adb logcat -d -s LabReport:I AndroidRuntime:E TestRunner:* > lab-emulator/logcat.txt || true
            timeout 120 adb pull /sdcard/Download/HikariLab lab-emulator/ || true
            timeout 30 adb shell ls -l /sdcard/Pictures/Hikari > lab-emulator/exported_files.txt || true
      - name: Print device reports
        if: always()
        run: |
          echo "===== LAB REPORTS ====="
          cat lab-emulator/HikariLab/*.txt 2>/dev/null || echo "(no reports)"
          echo "===== FAILURES ====="
          grep -E "failed:|AssertionError|Exception:|FATAL" lab-emulator/logcat.txt 2>/dev/null | head -40 || true
          echo "===== END ====="
      - name: Collect test reports
        if: always()
        run: |
          mkdir -p lab-emulator
          cp -r app/build/reports/androidTests lab-emulator/reports || true
          cp -r app/build/outputs/androidTest-results lab-emulator/results || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-emulator
          path: lab-emulator
      - name: Fail when tests failed
        run: test ! -f lab-emulator/TESTS_FAILED
