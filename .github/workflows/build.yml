name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk HikariCam.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HikariCam
          path: HikariCam.apk
      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hikari-v${{ github.run_number }}
          name: 光 Hikari 相機 #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: 用小米14 點下方的 HikariCam.apk 下載並安裝。
          files: HikariCam.apk
